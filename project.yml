name: LeagueSim
options:
  bundleIdPrefix: com.kabule
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  LeagueSim:
    type: application
    platform: iOS
    # Info.plist 显式随工程一起提交（刷题 App 是 XcodeGen 从 project.yml 生成，
    # 这里改成直接带文件，避免云端生成时丢键；properties 与文件内容保持一致）。
    info:
      path: LeagueSim/Info.plist
      properties:
        CFBundleDisplayName: NBA模拟器
        UILaunchStoryboardName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: LeagueSim
        excludes:
          - "README.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kabule.leaguesim
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CFBundleDisplayName: NBA模拟器
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
